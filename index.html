  theme() { return "Night"; }

  _slug(short) { return short.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

  introPalette() {

  }

  _resizeIntro() {
    const c = this._introCanvas;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = c.getBoundingClientRect();
    this._iw = r.width; this._ih = r.height;
    this._icTop = r.top; this._icLeft = r.left;
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
    c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);

  }

  _drawIntro() {

  }

  // Screen-print layers under the outline: a halftone dot screen in each bubble's ink, printed
  // slightly out of register, plus a second offset pass of the outline in the gold ink.
  _printIntroField(ctx, f, lobes, cx, cy, CR, ink, cols, hov, T) {
    const k = hov * hov * (3 - 2 * hov);
    const o = CR * 0.06 * k;
    const sp = Math.max(4, CR * 0.07);
    const pad = CR * 1.9;
    const x0 = cx - pad, y0 = cy - pad, n = Math.ceil(pad * 2 / sp);
    const paths = cols.map(() => new Path2D());

      const xo = (j & 1) ? sp * 0.5 : 0;
      for (let i = 0; i <= n; i++) {
        const x = x0 + xo + i * sp;
        const v = f(x, y);
        if (v < T) continue;
        let best = 0, bw = -1;

          const b = lobes[q], dx = x - b.x, dy = y - b.y, w = b.rr / (dx * dx + dy * dy + 0.0001);
          if (w > bw) { bw = w; best = q; }
        }
        // tone deepens towards each bubble's heart, like a halftone gradient
        const tone = Math.min(1, 0.3 + (v - T) * 0.55);
        const r = sp * 0.6 * Math.sqrt(tone) * k;
        if (r < 0.4) continue;
        const p = paths[best % paths.length];
        p.moveTo(x + o + r, y + o);
        p.arc(x + o, y + o, r, 0, Math.PI * 2);

  _strokeIntroField(ctx, lobes, cx, cy, CR, ink, cols, hov) {

  _resizeNespresso() {
    const c = this._nespCanvas;
    if (!c) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = c.getBoundingClientRect();
    this._nw = r.width; this._nh = r.height;
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
    c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);

  _drawNespresso() {

    try {
      const descEl = document.querySelectorAll('[data-role="cv-desc"]')[this.state.i];
      if (descEl) {
        const dr = descEl.getBoundingClientRect();
        const cr = c.getBoundingClientRect();
        descRect = { x0: dr.left - cr.left - 30, y0: dr.top - cr.top - 24, x1: dr.right - cr.left + 30, y1: dr.bottom - cr.top + 24 };

  _startVideo(canvas, src) {
    if (!canvas || canvas._videoStarted) return;
    canvas._videoStarted = true;
    (async () => {
      try {
        const resp = await fetch(src);
        const buf = await resp.arrayBuffer();
        const decoder = new ImageDecoder({ data: buf, type: "image/webp" });
        await decoder.tracks.ready;
        const frameCount = decoder.tracks.selectedTrack.frameCount;
        const ctx = canvas.getContext("2d");
        let i = 0;
        const drawFrame = async () => {
          if (!canvas.isConnected) return;
          const result = await decoder.decode({ frameIndex: i });
          const image = result.image;
          if (canvas.width !== image.displayWidth) {
            canvas.width = image.displayWidth;
            canvas.height = image.displayHeight;
          }
          ctx.drawImage(image, 0, 0);
          const dur = image.duration || 40000;
          image.close();
          i = (i + 1) % frameCount;
          canvas._timer = setTimeout(drawFrame, dur / 1000);
        };
        drawFrame();
      } catch (err) {
        console.warn("video playback failed", err);
      }
    })();
  }

  go(step) {
    this.setState((s) => {
      const n = DATA.length;
      const i = Math.min(n - 1, Math.max(0, s.i + step));
      return { i };
    });
  }

  _pillContrast(bg) {
    const m = /oklch\(\s*([\d.]+)/.exec(bg || "");
    const l = m ? parseFloat(m[1]) : 0.9;
    return l >= 0.55 ? "oklch(0.22 0.015 20)" : "oklch(0.97 0.01 30)";
  }

  renderVals() {

    // WebGL contexts per page and silently wipes the oldest when a new one is made — so unmounting
    // and remounting scenes on every swipe makes the visible ones vanish. On touch / low-memory
    // devices a scene is mounted when it first comes near and then KEPT (it pauses itself when
    // off-screen), so each context is created exactly once.
    const lowMem = typeof window !== "undefined" && ((window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || (navigator.deviceMemory && navigator.deviceMemory <= 4));

    // live 3D: no WebGL at all, so nothing can be wiped, and far less battery/memory.
    const stills = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(pointer: coarse) and (max-width: 700px) and (orientation: portrait), (pointer: coarse) and (max-height: 500px) and (orientation: landscape)").matches;

      if (!allow3d || stills) return false;
      const hit = i === active || (this._warm3d === true && Math.abs(i - active) <= (lowMem ? 1 : 2));
      if (!hit && this._vfEarly === true && active === 0 && DATA[i].short === "Vodafone") return lowMem ? ((this._kept3d = this._kept3d || {})[i] = true) : true;
      if (!lowMem) return hit;
      this._kept3d = this._kept3d || {};
      if (hit) this._kept3d[i] = true;
      return !!this._kept3d[i];
    };
    const info = this.state.info;
    const isNarrowPortrait = typeof window !== "undefined" && window.innerWidth <= 700 && window.innerHeight > window.innerWidth;
    const introPalette = this.introPalette();
    const activeIsDayNight = !!DATA[active].dayNight;
    const activeTheme = activeIsDayNight
      ? { text: THEME.dark.text, desc: THEME.dark.desc, link: THEME.dark.link, nav: THEME.dark.nav, pillBg: introPalette.ink + "22" }
      : { ...(DATA[active].dark ? THEME.dark : THEME.light) };
    if (DATA[active].navLinkColor) activeTheme.nav = DATA[active].navLinkColor;
    const entries = DATA.map((d, i) => {
      const on = i === active;
      const theme = d.dark ? THEME.dark : THEME.light;
      return {
        year: d.year,
        short: d.short,
        company: d.company,
        title: d.title,
        meta: d.meta,
        showEmail: !!d.email,
        desc: d.desc,
        link: d.link,
        linkLabel: d.linkLabel,
        showLink: !!d.link,
        active: on ? "true" : undefined,
        navAriaLabel: d.company + ", " + d.year,
        onLinkClick: () => { history.replaceState(null, "", "#" + this._slug(d.short)); },
        slotId: "cv-" + i,
        slotHint: d.slot,
        images: Array.from({ length: d.imageCount != null ? d.imageCount : 5 }, (_, n) => {
          const count = d.smartComp ? 6 : (d.imageCount != null ? d.imageCount : 5);
          const leaving = i < active;
          const rank = leaving ? (count - 1 - n) : n;
          const smartFactors = [1.3, 1.15, 1.6, 1.75, 1.85, 1.8];
          const factor = d.smartComp ? smartFactors[n] : 1 + rank * 0.16;
          const dx = on
            ? "0%"
            : (leaving
                ? "calc(" + (-100 * factor) + "% - " + (100 * factor) + "vw)"
                : "calc(" + (100 * factor) + "% + " + (100 * factor) + "vw)");
          const depth = d.videoSrc ? 0 : ([18, 10, 10, 16][n] || 12);
          const mx = this.state.mx || 0, my = this.state.my || 0;
          const px = (mx * depth).toFixed(1) + "px";
          const py = (my * depth * 0.6).toFixed(1) + "px";
          const slotId = "cv-" + d.idKey + "-" + n;
          const delay = d.smartComp ? n * 30 : n * 60;
          if (n === 0 && d.videoSrc && Math.abs(i - active) <= 1) this._videoLoaded = true;
          const videoSlotSrc = n === 0 && d.videoSrc ? (this._videoLoaded ? VIDEO_SRC() : "") : null;
          return { id: slotId, hint: (d.slotHints && d.slotHints[n]) || (n === 0 ? d.slot : "photo " + (n + 1)), dx, delay, px, py, aspect: d.aspect || "16/9", src: videoSlotSrc != null ? videoSlotSrc : (EXTRACTED_SRC[slotId] || "") };
        }),
        videoReady: !!d.videoSrc && !!this._videoLoaded,
        videoPending: !!d.videoSrc && !this._videoLoaded,
        noVideo: !d.videoSrc,
        videoRef: (el) => this._startVideo(el, d.videoSrc ? VIDEO_SRC() : null),
        videoTagRef: (el) => { if (el) { this._videoEl = el; const s = d.videoSrc ? VIDEO_SRC() : null; if (s && el.getAttribute("src") !== s) el.setAttribute("src", s); } },
        imgFloat: d.float ? "cvFloat 5.2s ease-in-out infinite" : "none",
        showBlobs: !!d.blobs,
        blobOp: 1,
        blobLeftW: "min(" + Math.round(320 * (d.blobScale || 1)) + "px, " + Math.round(28 * (d.blobScale || 1)) + "vw)",
        blobLeftH: Math.round(56 * (d.blobScale || 1)) + "%",
        blobRightW: "min(" + Math.round(300 * (d.blobRightScale || d.blobScale || 1)) + "px, " + Math.round(26 * (d.blobRightScale || d.blobScale || 1)) + "vw)",
        blobRightH: Math.round(50 * (d.blobRightScale || d.blobScale || 1)) + "%",
        blobDx: on ? "0px" : (i < active ? "calc(-100vw - 100%)" : "calc(100vw + 100%)"),
        introDx: on ? "0px" : (i < active ? "calc(-100vw - 100%)" : "calc(100vw + 100%)"),
        stillOn: stills && !!STILLS[d.short],
        stillName: (STILLS[d.short] || [""])[0],
        stillSrc: STILLS[d.short] ? "./assets/mobile/" + STILLS[d.short][0] + ".webp?v=12" : "",
        // AKQA: the upright capture frames the iPad larger, so it is used sideways too
        stillLand: STILLS[d.short] ? "./assets/mobile/" + STILLS[d.short][0] + (STILLS[d.short][0] === "akqa" ? "" : "-land") + ".webp?v=12" : "",
        stillAlt: STILLS[d.short] ? STILLS[d.short][1] : "",
        blobLeftPx: ((this.state.mx || 0) * 26).toFixed(1) + "px",
        blobLeftPy: ((this.state.my || 0) * 16).toFixed(1) + "px",
        blobRightPx: ((this.state.mx || 0) * 34).toFixed(1) + "px",
        blobRightPy: ((this.state.my || 0) * 20).toFixed(1) + "px",
        img3: d.thirdBig
          ? { l0: "5.8%", w0: "25.4%", l1: "28.2%", w1: "19%", l2: "50.2%", w2: "44%" }
          : { l0: "5.4%", w0: "27.2%", l1: "36.4%", w1: "27.2%", l2: "67.4%", w2: "27.2%" },
        smartComp: !!d.smartComp,
        secKey: SLUGIFY(d.short),
        wide1: (d.imageCount != null ? d.imageCount : 5) === 1,
        wide3: (d.imageCount != null ? d.imageCount : 5) === 3,
        vf3dNear: near3d(i),
        gu3dNear: near3d(i),
        smart3dNear: near3d(i),
        akqa3dNear: near3d(i),
        isApproach: !!d.approach,
        approachOn: !!d.approach && !stills,
        approachNear: near3d(i),
        wide4: (d.imageCount != null ? d.imageCount : 5) === 4 && !d.evenGrid,
        wide4Even: (d.imageCount != null ? d.imageCount : 5) === 4 && !!d.evenGrid,
        wide5: (d.imageCount != null ? d.imageCount : 5) === 5,
        wide6: (d.imageCount != null ? d.imageCount : 5) === 6,
        imgCount: d.imageCount != null ? d.imageCount : 5,
        bg: d.dayNight ? "radial-gradient(circle at 50% 45%, #1c5485 0%, #123d5e 55%, #0a243b 100%)" : (d.bg || "oklch(0.934 0.02 6)"),
        bgOp: on ? 1 : 0,
        dayNight: !!d.dayNight,
        introBg: introPalette.bg,
        introInk: introPalette.ink,
        introCanvasRef: (el) => { this._introCanvas = el; if (el) this._resizeIntro(); },
        nespressoCanvasRef: (el) => { this._nespCanvas = el; if (el) this._resizeNespresso(); },
        abstractComp: !!d.abstractComp,
        bt3dNear: !stills,
        stills: stills,
        textColor: d.dayNight ? THEME.dark.text : (d.textColor || theme.text),
        descColor: d.dayNight ? THEME.dark.desc : (d.descColor || theme.desc),
        linkColor: d.dayNight ? THEME.dark.link : theme.desc,
        groupLeft: d.abstractComp ? "-8%" : (d.dayNight ? "min(120px, 12vw)" : ((d.imageCount != null ? d.imageCount : 5) === 6 || d.smartComp ? "0" : "min(400px, 40vw)")),
        groupRight: d.dayNight ? "min(120px, 12vw)" : ((d.imageCount != null ? d.imageCount : 5) === 6 || d.smartComp || d.abstractComp ? "0" : "min(400px, 40vw)"),
        groupTop: d.abstractComp ? (isNarrowPortrait ? "30%" : "14%") : (d.dayNight ? "1%" : ((d.imageCount != null ? d.imageCount : 5) === 4 ? "3%" : ((d.imageCount != null ? d.imageCount : 5) === 6 || d.smartComp ? "0" : "9%"))),
        groupBottom: d.abstractComp ? (isNarrowPortrait ? "6%" : "22%") : (d.dayNight ? "1%" : ((d.imageCount != null ? d.imageCount : 5) === 4 ? "3%" : ((d.imageCount != null ? d.imageCount : 5) === 6 || d.smartComp ? "0" : "9%"))),
        pe: on ? "auto" : "none",
        dx: on ? "0px" : (i < active ? "-9vw" : "9vw"),
        imgZ: (d.imageCount != null ? d.imageCount : 5) === 6 ? 1 : (on ? 5 : 1),
        textOp: on ? 1 : 0,
        ty: on ? "0px" : "14px",
        descOp: on && info ? 1 : 0,
        navOp: on ? 1 : (DATA[active].navLinkColor ? 0.86 : 0.68),
        navWeight: 700,
        navBg: "transparent",
        navColor: on ? (d.dayNight ? THEME.dark.nav : (d.navTextColor || this._pillContrast(d.navBg || theme.pillBg))) : activeTheme.nav,
        navItemRef: (el) => { if (el) this._navItemEls = this._navItemEls || {}; if (el) this._navItemEls[i] = el; },
        vf3dRef: (el) => { this._vf3dEls = this._vf3dEls || {}; if (el) this._vf3dEls[i] = el; else delete this._vf3dEls[i]; },
        gu3dRef: (el) => { this._gu3dEls = this._gu3dEls || {}; if (el) this._gu3dEls[i] = el; else delete this._gu3dEls[i]; },
        smart3dRef: (el) => { this._smart3dEls = this._smart3dEls || {}; if (el) this._smart3dEls[i] = el; else delete this._smart3dEls[i]; },
        select: () => { history.replaceState(null, "", "#" + this._slug(d.short)); this.setState({ i }); }
      };
    });
    return {
      entries,
      smartLeftOffsetVar: (this.props.smartLeftOffset ?? 0) + "%",
      prev: () => this.go(-1),
      next: () => this.go(1),
      toggleInfo: () => this.setState((s) => ({ info: !s.info })),
      navRef: (el) => { this._navEl = el; },
      indicatorLeft: (this.state.indicatorLeft || 0) + "px",
      indicatorWidth: (this.state.indicatorWidth || 0) + "px",
      indicatorBg: activeIsDayNight ? (introPalette.ink + "22") : (DATA[active].navBg || activeTheme.pillBg),
      activeSlug: this._slug(DATA[active].short),
      indicatorOp: this.state.indicatorReady ? 1 : 0
    };
  }

  _syncVf3d() {
    const active = this.state.i;
    const els = this._vf3dEls;
    if (!els) return;
    for (const k in els) {
      const idx = +k, el = els[k];
      const dist = Math.abs(idx - active);
      const state = active === 0 ? "standby" : (dist <= 1 ? "active" : "inactive");
      if (el._vf3dState === state) continue;
      el._vf3dState = state;
      try { el.contentWindow.postMessage({ type: "vf3d-visibility", state }, "*"); } catch (err) {}
    }
  }

  _syncGu3d() {
    const active = this.state.i;
    const els = this._gu3dEls;
    if (!els) return;
    for (const k in els) {
      const idx = +k, el = els[k];
      if (!el || !el.contentWindow) continue;
      const dist = Math.abs(idx - active);
      const state = dist <= 1 ? "active" : "inactive";
      if (el._gu3dState === state) continue;
      el._gu3dState = state;
      try { el.contentWindow.postMessage({ type: "gu3d-visibility", state }, "*"); } catch (err) {}
    }
  }

  _syncIndicator() {
    const item = this._navItemEls && this._navItemEls[this.state.i];
    if (!item) return;
    const left = item.offsetLeft, width = item.offsetWidth;
    if (left !== this.state.indicatorLeft || width !== this.state.indicatorWidth) {
      this.setState({ indicatorLeft: left, indicatorWidth: width, indicatorReady: true });
    }
  }

  _syncThemeColor() {
    // Browser chrome tint is a single static #0a243b meta in <head>; nothing per-section here
    
    document.documentElement.style.background = "";
    document.body.style.background = "";
  }

  _applySlotSrc() {
    for (const el of document.querySelectorAll("image-slot[data-slot-src]")) {
      const v = el.getAttribute("data-slot-src") || "";
      if (!v || v.indexOf("{{") >= 0) continue;
      if (el.getAttribute("src") !== v) el.setAttribute("src", v);
    }
  }

  // Fit each phone still into the free space of its section, measured from the real text:
  //   portrait  — between the bottom of the title block and the top of the description
  //   landscape — right of the text column, above the tab bar
  // Written to CSS variables on <html>, re-run on every render, resize and rotation.
  _placeStills() {
    this._fitDescs();
    const boxes = document.querySelectorAll('[data-role="cv-stillbox"]');
    if (!boxes.length) return;
    const root = document.documentElement;
    const land = window.innerWidth > window.innerHeight;
    const nav = document.querySelector('[data-role="cv-yearnav"]');
    const navTop = nav ? nav.getBoundingClientRect().top : window.innerHeight;
    for (const b of boxes) {
      const entry = b.closest('[data-role="cv-entry"]');
      const name = b.getAttribute("data-still");
      if (!entry || !name) continue;
      const head = entry.querySelector('[data-role="cv-title"]');
      const desc = entry.querySelector('[data-role="cv-desc"]');
      const ew = entry.clientWidth, eh = entry.clientHeight;
      let x, y, w, h;
      if (!land) {
        const gap = 8;
        y = (head ? head.offsetTop + head.offsetHeight : 0) + gap;
        h = (desc ? desc.offsetTop : Math.min(navTop, eh)) - gap - y;
        x = 12; w = ew - 24;
      } else {
        const textRight = Math.max(head ? head.offsetLeft + head.offsetWidth : 0, desc ? desc.offsetLeft + desc.offsetWidth : 0);
        x = textRight + 20; w = ew - x - 20;
        y = 12; h = Math.min(navTop, eh) - 8 - y;
      }
      // bigger heroes on phones: widen the box (a little bleed past the screen edge is fine);
      // "contain" then grows the image until it meets the height limit
      const GROW = land ? { smart: 1.1, akqa: 1.35 } : { smart: 1.0, nespresso: 0.94, guardian: 1.2, akqa: 1.12 };
      const g = GROW[name] || 1;
      x -= (w * (g - 1)) / 2; w *= g;
      // Nespresso: the wordmark sits at 48% of the image (pods hang off the left), so shift the
      // image right until the letters are centred on the screen
      if (name === "nespresso" && !land) {
        const aspect = 701 / 223, rw = Math.min(w, h * aspect);
        x += (0.5 - 0.481) * rw;
      }
      if (name === "akqa" && !land) {
        // phones upright: a smaller image with the iPad itself (at fx, fy of the still, not the
        // image's middle, as the blood cells hang off it unevenly) centred across the screen and
        // in the space between the title and the description
        const fx = 0.471, fy = 0.442, aspect = 717 / 665;
        const midY = y + h / 2;
        const ih = Math.min((ew * 0.9) / aspect, h * 0.9), iw = ih * aspect;
        x = ew / 2 - fx * iw; w = iw; y = midY - fy * ih; h = ih;
      } else if (name === "akqa") {
        // the iPad sits at (fx, fy) of the trimmed still; put its centre on the page's vertical centre
        const fy = 0.442, aspect = 717 / 665;
        const cy = eh / 2, top = y, bottom = y + h;
        if (cy > top && cy < bottom) {
          const ih = Math.min((cy - top) / fy, (bottom - cy) / (1 - fy), w / aspect);
          const iw = ih * aspect;
          const free = Math.min(h, w / aspect);
          if (ih >= free * 0.7) { x = x + (w - iw) / 2; w = iw; y = cy - fy * ih; h = ih; }
          if (land) y -= Math.round(eh * 0.03);   // a touch higher sideways
        }
      }
      root.style.setProperty("--st-" + name + "-x", Math.round(x) + "px");
      root.style.setProperty("--st-" + name + "-y", Math.round(y) + "px");
      root.style.setProperty("--st-" + name + "-w", Math.max(0, Math.round(w)) + "px");
      root.style.setProperty("--st-" + name + "-h", Math.max(0, Math.round(h)) + "px");
    }
  }

  // Align the thing the eye should land on, measured from the live layout:
  //   AKQA (all 3D sizes): the iPad (centre of its scene) on the page's vertical centre
  //   Nespresso (tablets): the BUILT TOGETHER wordmark centred across the page and in the space
  //   between title and description, a touch high to balance the taller description.
  _alignFocus() {
    const root = document.documentElement, vw = window.innerWidth, vh = window.innerHeight;
    const num = (v) => parseFloat(getComputedStyle(root).getPropertyValue(v)) || 0;
    const ak = document.querySelector('[data-role="cv-akqa3d"] iframe');
    if (ak) {
      const r = ak.getBoundingClientRect();
      if (r.height) {
        const tabletPortrait = vh > vw && vw > 700 && vw <= 1400;
        const d = (vh / 2 - (tabletPortrait ? vh * 0.035 : 0)) - (r.top + r.height / 2);
        if (Math.abs(d) > 1) root.style.setProperty("--akqa-dy", Math.round(num("--akqa-dy") + d) + "px");
      }
    }
    const tablet = window.matchMedia && window.matchMedia("(pointer: coarse)").matches && !document.querySelector('[data-role="cv-stillbox"]');
    const bt = document.querySelector('iframe[data-role="cv-bt3d"]');
    if (!tablet || !bt) return;
    // Measure against the group box: it doesn't slide or bob, so this works before Nespresso is
    // ever on screen and the wordmark is already in place when you arrive (no visible jumps).
    const group = bt.closest('[data-role="cv-imggroup"]');
    const r = (group || bt).getBoundingClientRect();
    if (!r.width) return;
    const sizeKey = vw + "x" + vh;
    if (this._nespAlignedFor === sizeKey) return;
    let doc; try { doc = bt.contentDocument; } catch (e) { return; }
    const words = doc ? [...doc.querySelectorAll('svg[aria-label="BUILT"], svg[aria-label="TOGETHER"]')] : [];
    if (words.length < 2) return;
    const k = r.width / (bt.clientWidth || r.width);
    let l = 1e9, t = 1e9, rr = -1e9, b = -1e9;
    for (const w of words) { const q = w.getBoundingClientRect(); l = Math.min(l, q.left); t = Math.min(t, q.top); rr = Math.max(rr, q.right); b = Math.max(b, q.bottom); }
    const cx = r.left + ((l + rr) / 2) * k, cy = r.top + ((t + b) / 2) * k;
    const entry = bt.closest('[data-role="cv-entry"]');
    const head = entry && entry.querySelector('[data-role="cv-title"]');
    const desc = entry && entry.querySelector('[data-role="cv-desc"]');
    const top = head ? head.getBoundingClientRect().bottom : vh * 0.15;
    const bottom = desc ? desc.getBoundingClientRect().top : vh * 0.8;
    const ty = (top + bottom) / 2 - vh * 0.03;
    const dx = vw / 2 - cx, dy = ty - cy;
    if (Math.abs(dx) > 6) root.style.setProperty("--nesp-dx", Math.round(num("--nesp-dx") + dx) + "px");
    if (Math.abs(dy) > 6) root.style.setProperty("--nesp-dy", Math.round(num("--nesp-dy") + dy) + "px");
    // settled: lock this size so it never nudges again while you're looking at it
    if (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) this._nespAlignedFor = sizeKey;
  }

  // Re-measure a few times after the section or the window size changes (scenes load and settle
  // over a few seconds). Other re-renders don't reset the sequence.
  _scheduleAlign(force) {
    const key = (this.state.i === 3 || this.state.i === 6 ? this.state.i : "x") + ":" + window.innerWidth + "x" + window.innerHeight;
    if (!force && key === this._alignKey) return;
    this._alignKey = key;
    (this._alignTimers || []).forEach(clearTimeout);
    this._alignTimers = [500, 1200, 2400, 4000, 6500, 9500].map((t) => setTimeout(() => this._alignFocus(), t));
  }

  _fitDescs() {
    const short = window.innerWidth > window.innerHeight && window.innerHeight <= 500;
    for (const entry of document.querySelectorAll('[data-role="cv-entry"]')) {
      const head = entry.querySelector('[data-role="cv-title"]');
      const desc = entry.querySelector('[data-role="cv-desc"]');
      if (!head || !desc) continue;
      if (short) desc.style.setProperty("top", Math.round(head.offsetTop + head.offsetHeight + 10) + "px", "important");
      else desc.style.removeProperty("top");
    }
  }

  componentDidUpdate() {
    this._fitDescs();
    this._placeStills();
    this._scheduleAlign();
    this._applySlotSrc();
    this._syncThemeColor();
    this._syncVf3d();
    this._syncGu3d();
    const nav = this._navEl, item = this._navItemEls && this._navItemEls[this.state.i];
    const v = this._videoEl;
    if (v && v.getAttribute("src") && v.paused) {
      v.load();
      const p = v.play();
      if (p) p.catch(() => {});
    }
    if (!nav || !item) return;
    const navRect = nav.getBoundingClientRect();
    const itemRect = item.getBoundingClientRect();
    const prevEl = this._navItemEls && this._navItemEls[this.state.i - 1];
    const nextEl = this._navItemEls && this._navItemEls[this.state.i + 1];
    const leftMargin = prevEl ? prevEl.offsetWidth + 2 : 28;
    const rightMargin = nextEl ? nextEl.offsetWidth + 2 : 28;
    let target = null;
    if (itemRect.left - leftMargin < navRect.left) {
      target = nav.scrollLeft - ((navRect.left - itemRect.left) + leftMargin);
    } else if (itemRect.right + rightMargin > navRect.right) {
      target = nav.scrollLeft + ((itemRect.right - navRect.right) + rightMargin);
    }
    if (target !== null) this._animateScrollTo(nav, Math.max(0, Math.min(target, nav.scrollWidth - nav.clientWidth)));
    const left = item.offsetLeft, width = item.offsetWidth;
    if (left !== this.state.indicatorLeft || width !== this.state.indicatorWidth) {
      this.setState({ indicatorLeft: left, indicatorWidth: width, indicatorReady: true });
    }
  }

  _animateScrollTo(el, target) {
    if (this._scrollRaf) cancelAnimationFrame(this._scrollRaf);
    const start = el.scrollLeft;
    const delta = target - start;
    const duration = 420;
    const startTime = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      el.scrollLeft = start + delta * ease(t);
      if (t < 1) this._scrollRaf = requestAnimationFrame(step);
      else this._scrollRaf = null;
    };
    this._scrollRaf = requestAnimationFrame(step);
  }
}
</script>
</body>
</html>
