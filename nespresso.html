<script type="text/x-dc" data-dc-script data-props="{&quot;spinSensitivity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;tiltAmount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;idleSpin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  constructor(p){
    super(p);
    this.stageRef = React.createRef();
    this.tiltRef = React.createRef();
    this.glRef = React.createRef();
    this.ptr = {x:0,y:0,tx:0,ty:0};
    this.spin = 0; this.swipe = 0; this.drift = 0;
    this.last = null;
  }
  renderVals(){
    return {stageRef:this.stageRef, tiltRef:this.tiltRef, glRef:this.glRef};
  }
  componentDidMount(){
    this.fit(); this.bind(); this.initGL(); this.watchdog();
  }
  watchdog(){
    clearInterval(this._watch);
    this._watch = setInterval(() => {
      const gone = !this.renderer || !this.renderer.domElement.isConnected;
      const stalled = this.lastFrame && (performance.now() - this.lastFrame > 900) && document.visibilityState === 'visible';
      if(gone){
        this.dead = false; this.renderer = null; this._booting = false;
        if(this.glRef.current) this.glRef.current.innerHTML = '';
        this.initGL();
      } else if(stalled && this.resume){
        this.dead = false; this.resume();
      }
    }, 1000);
  }
  componentDidUpdate(){
    if(!this.renderer && !this._booting && this.glRef.current){
      this._booting = true; this.dead = false;
      this.glRef.current.innerHTML = '';
      this.initGL();
    }
  }
  componentWillUnmount(){
    this.dead = true;
    clearInterval(this._watch);
    window.removeEventListener('resize', this._fit);
    window.removeEventListener('pointermove', this._move);
    window.removeEventListener('touchmove', this._touch);
    window.removeEventListener('message', this._msg);
    window.removeEventListener('wheel', this._wheel);
    if(this.renderer) this.renderer.dispose();
  }
  fit(){
    const el = this.stageRef.current; if(!el) return;
    const s = Math.min(window.innerWidth/1620, window.innerHeight/760);
    el.style.transform = 'translate(-50%,-50%) scale(' + s + ') translate(-15.5px,-32px)';
    this.stageScale = s;
    if(this.renderer) this.renderer.setPixelRatio(Math.min(devicePixelRatio * Math.max(s, 0.5), 3));
  }
  bind(){
    this._fit = () => this.fit();
    this._move = (e) => {
      const w = window.innerWidth, h = window.innerHeight;
      this.ptr.tx = (e.clientX/w - 0.5)*2;
      this.ptr.ty = (e.clientY/h - 0.5)*2;
    };
    this._touch = (e) => {
      const t = e.touches[0]; if(!t) return;
      const w = window.innerWidth, h = window.innerHeight;
      this.ptr.tx = (t.clientX/w - 0.5)*2;
      this.ptr.ty = (t.clientY/h - 0.5)*2;
      if(this.last !== null) this.swipe += (t.clientX - this.last) * 0.012 * this.sens();
      this.last = t.clientX;
    };
    this._wheel = (e) => { this.swipe += e.deltaY * 0.004 * this.sens(); };
    this._msg = (ev) => {
      const d = ev && ev.data;
      if (!d || d.type !== 'btPointer') return;
      this.ptr.tx = (d.nx - 0.5) * 2;
      this.ptr.ty = (d.ny - 0.5) * 2;
      this.lastInput = performance.now();
      if (d.dx) this.swipe += d.dx * 0.012 * this.sens();
    };
    window.addEventListener('message', this._msg);
    window.addEventListener('resize', this._fit);
    window.addEventListener('pointermove', this._move);
    window.addEventListener('touchmove', this._touch, {passive:true});
    window.addEventListener('wheel', this._wheel, {passive:true});
  }
  sens(){ return this.props.spinSensitivity ?? 1; }
  async initGL(){
    const THREE = await import('three');
    const {RoomEnvironment} = await import('three/addons/environments/RoomEnvironment.js');
    if(this.dead || !this.glRef.current) return;
    const W = 1592, H = 852;
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio * Math.max(this.stageScale || 1, 0.5), 3));
    renderer.setSize(W, H, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    if(this.renderer && this.renderer !== renderer){ try{ this.renderer.dispose(); }catch(e){} }
    this.glRef.current.innerHTML = '';
    this.glRef.current.appendChild(renderer.domElement);
    this.renderer = renderer;
    this._booting = false;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const dist = (H/2)/Math.tan(THREE.MathUtils.degToRad(15));
    const camera = new THREE.PerspectiveCamera(30, W/H, 10, 6000);
    camera.position.set(0,0,dist);
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1,1.4,2); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffd9e6, 0.75); rim.position.set(2,-0.6,1); scene.add(rim);
    const fill = new THREE.DirectionalLight(0xffffff, 1.6); fill.position.set(-2.2,0.4,1.6); scene.add(fill);

    // capsule profile: closed narrow base -> flared open rim
    const pts = [
      [0.00,-0.045],[0.11,-0.038],[0.21,-0.014],[0.29,0.028],[0.335,0.088],
      [0.40,0.42],[0.462,0.80],[0.492,0.865],[0.50,0.90]
    ].map(p => new THREE.Vector2(p[0], p[1]));
    const innerPts = [
      [0.497,0.899],[0.487,0.886],[0.468,0.874]
    ].map(p => new THREE.Vector2(p[0], p[1]));
    const lid = new THREE.SphereGeometry(1.322, 96, 24, 0, Math.PI*2, 0, THREE.MathUtils.degToRad(20.8));
    lid.translate(0, -0.360, 0);
    const shCv = document.createElement('canvas');
    shCv.width = shCv.height = 256;
    const shx = shCv.getContext('2d');
    const grd = shx.createRadialGradient(128, 128, 6, 128, 128, 126);
    grd.addColorStop(0, 'rgba(8,2,14,0.46)');
    grd.addColorStop(0.45, 'rgba(8,2,14,0.32)');
    grd.addColorStop(1, 'rgba(8,2,14,0)');
    shx.fillStyle = grd; shx.fillRect(0, 0, 256, 256);
    const shadowTex = new THREE.CanvasTexture(shCv);
    const shadowGeo = new THREE.PlaneGeometry(1, 1);

    const shell = new THREE.LatheGeometry(pts, 96);
    const inner = new THREE.LatheGeometry(innerPts, 96);
    shell.computeVertexNormals(); inner.computeVertexNormals();

    const makePod = (color, size, pos, tilt, envI) => {
      const g = new THREE.Group();
      const spinner = new THREE.Group();
      const metal = new THREE.MeshPhysicalMaterial({color:color, metalness:0.92, roughness:envI > 5 ? 0.11 : 0.2, envMapIntensity:envI || 2.4, clearcoat:1, clearcoatRoughness:0.08});
      const lining = new THREE.MeshPhysicalMaterial({color:0xc9ced2, metalness:1, roughness:0.2, envMapIntensity:(envI || 2.4)*1.1, side:THREE.DoubleSide});
      const foil = new THREE.MeshPhysicalMaterial({color:0xd3d8dc, metalness:1, roughness:0.24, envMapIntensity:(envI || 2.4)*1.05, side:THREE.DoubleSide});
      spinner.add(new THREE.Mesh(shell, metal));
      spinner.add(new THREE.Mesh(inner, lining));
      spinner.add(new THREE.Mesh(lid, foil));
      spinner.position.y = -0.45;
      const holder = new THREE.Group();
      holder.add(spinner);
      holder.scale.set(size, size*0.93, size);
      holder.rotation.set(tilt[0], 0, tilt[2]);
      g.add(holder);
      g.position.set(pos[0], pos[1], pos[2]||0);
      const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({
        map:shadowTex, transparent:true, depthWrite:false, depthTest:false, opacity:0.95
      }));
      shadow.scale.set(size*1.75, size*1.3, 1);
      shadow.position.set(pos[0] + size*0.34, pos[1] - size*0.34, (pos[2]||0) - 1);
      shadow.renderOrder = -1;
      scene.add(shadow);
      scene.add(g);
      return {group:g, spinner:spinner, holder:holder, base:tilt, shadow:shadow, size:size, home:[pos[0], pos[1]]};
    };

    const d = Math.PI/180;
    this.pods = [
      makePod(0xdc424f, 96, [-596, 66, 40], [ 22*d, 0, -22*d], 7.0),
      makePod(0xcf6a09, 94, [ 604, -30, 70], [-10*d, 0, 112*d]),
      makePod(0x137f30, 94, [-272,-174, 55], [ 26*d, 0, -118*d])
    ];

    // Each call starts ONE animation loop and retires any older one (token), so the watchdog's
    // resume can never stack a second loop on top — stacked loops made the pods spin faster and faster.
    const makeTick = () => {
    const myToken = (this.loopToken = (this.loopToken || 0) + 1);
    const tick = () => {
      if(this.dead || this.loopToken !== myToken) return;
      this.lastFrame = performance.now();
      this.drift += (this.props.idleSpin ?? true) ? 0.005 : 0;
      if (this.lastInput && performance.now() - this.lastInput > 900) { this.ptr.tx *= 0.94; this.ptr.ty *= 0.94; }
      const target = this.ptr.x * 5.2 * this.sens() + this.swipe;
      this.spin += (target - this.spin) * 0.09;
      this.ptr.x += (this.ptr.tx - this.ptr.x)*0.07;
      this.ptr.y += (this.ptr.ty - this.ptr.y)*0.07;
      const t = (this.props.tiltAmount ?? 1);
      const ry = this.ptr.x * 5.5 * t, rx = -this.ptr.y * 3.5 * t;
      if(this.tiltRef.current){
        this.tiltRef.current.style.transform =
          'translateZ(-220px) scale(1.1375) rotateY(' + ry + 'deg) rotateX(' + rx + 'deg) translate3d(' + (-this.ptr.x*14*t) + 'px,' + (-this.ptr.y*10*t) + 'px,0)';
      }
      this.pods.forEach((p, i) => {
        p.spinner.rotation.y = (this.spin + this.drift) * (1 + i*0.22);
        const ph = this.drift * (1 + i*0.17) + i*2.1;
        const sway = (this.props.idleSpin ?? true) ? 1 : 0;
        p.holder.rotation.x = p.base[0] + Math.sin(ph) * 0.20 * sway;
        p.holder.rotation.z = p.base[2] + Math.cos(ph*0.78 + 1.3) * 0.26 * sway;
        p.holder.rotation.y = Math.sin(ph*0.61 + 0.7) * 0.34 * sway;
        p.group.position.y = p.home[1] + Math.sin(ph*0.85 + i) * p.size*0.05 * sway;
        p.group.rotation.y = this.ptr.x * 0.8 * t;
        p.group.rotation.x = -this.ptr.y * 0.6 * t;
        p.shadow.position.x = p.home[0] + p.size*0.34 + this.ptr.x * p.size*0.22;
        p.shadow.position.y = p.home[1] - p.size*0.34 - this.ptr.y * p.size*0.18 + Math.sin(ph*0.85 + i) * p.size*0.03 * sway;
      });
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    };
    return tick;
    };
    this.resume = () => makeTick()();
    makeTick()();
  }
}
