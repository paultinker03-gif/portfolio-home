<script>
// When this document is inlined and mounted as a blob: URL, it has no
// directory to resolve relative asset paths against. Re-base on the parent.
try {
  if (location.href.indexOf('blob:') === 0 && parent !== window) {
    var b = document.createElement('base');
    b.href = new URL('.', parent.location.href).href;
    document.head.appendChild(b);
  }
} catch (e) {}
</script>

</style>
<script>
window.CVRES = function (p) {
  try {
    var r = (window.__resources && Object.keys(window.__resources).length ? window.__resources : null)
         || (window.parent && window.parent !== window ? window.parent.__resources : null) || {};
    var k = decodeURIComponent(String(p).split("/").pop());
    return r[k] || p;
  } catch (e) { return p; }
};
</script>
</head>
<body>
<smart-scene background="transparent" parallax="1" float-speed="1"></smart-scene>
<script src="smart-scene.js?v=13"></script>
<script>
  const q = new URLSearchParams(location.search);
  const s = document.querySelector('smart-scene');
  if (q.has('embed')) {
    s.style.height = '100%';
    s.style.minHeight = '0';
  }
  if (q.has('bg')) {
    const bg = q.get('bg');
    s.setAttribute('background', bg);
    document.documentElement.style.background = bg === 'transparent' ? 'transparent' : bg;
    document.body.style.background = bg === 'transparent' ? 'transparent' : bg;
  }
</script>
